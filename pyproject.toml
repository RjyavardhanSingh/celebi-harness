[project]
name = "celebi"
version = "0.1.0"
description = "LLM Time Travel Harness — proxy, record, and replay LLM conversations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11.2",
    "httpx>=0.28.1",
    "fastapi>=0.141.1",
    "kuzu>=0.11.3",
    "litellm[proxy]>=1.100.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[project.scripts]
celebi = "celebi.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11.0",
    "pyinstaller>=6.0",
]
docs = [
    "mkdocs-material>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celebi"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    "E501",
    "N802",
    "N807",
    "SIM105",
    "SIM108",
    "SIM117",
    "B904",
    "BLE001",
    "S110",
    "PLW1510",
    "DTZ005",
]

[tool.ruff.lint.isort]
known-first-party = ["celebi", "app"]

[tool.ruff.format]
quote-style = "double"
