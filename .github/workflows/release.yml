name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # ─── Resolve version ──────────────────────────────────────────
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag: $TAG)"

  # ─── macOS DMG ────────────────────────────────────────────────
  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Build PyInstaller bundle
        run: uv run pyinstaller celebi.spec --noconfirm

      - name: Build DMG
        run: |
          chmod +x packaging/macos/build-dmg.sh
          ./packaging/macos/build-dmg.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: celebi-macos-dmg
          path: celebi-*-macos.dmg
          if-no-files-found: error

  # ─── Linux .deb ───────────────────────────────────────────────
  build-linux:
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg-dev \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Build PyInstaller bundle
        run: uv run pyinstaller celebi.spec --noconfirm

      - name: Build .deb package
        run: |
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: celebi-linux-deb
          path: dist/celebi_*.deb
          if-no-files-found: error

  # ─── Windows .exe installer ──────────────────────────────────
  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build PyInstaller bundle
        run: uv run pyinstaller celebi.spec --noconfirm

      - name: Build Windows installer
        shell: pwsh
        run: |
          .\packaging\windows\build-exe.ps1 -Version "${{ needs.resolve-version.outputs.version }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: celebi-windows-exe
          path: celebi-*-windows-setup.exe
          if-no-files-found: error

  # ─── Create GitHub Release ───────────────────────────────────
  release:
    needs: [resolve-version, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"

          # Create release with auto-generated notes
          gh release create "$TAG" \
            --title "Celebi v$VERSION" \
            --generate-notes \
            artifacts/**/*.deb \
            artifacts/**/*.dmg \
            artifacts/**/*.exe \
            artifacts/**/*.sha256 || \
          gh release upload "$TAG" \
            --clobber \
            artifacts/**/*.deb \
            artifacts/**/*.dmg \
            artifacts/**/*.exe \
            artifacts/**/*.sha256
