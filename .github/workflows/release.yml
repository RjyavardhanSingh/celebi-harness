name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: celebi-linux-x64
            archive: tar.gz
          - os: macos-latest
            artifact: celebi-macos-arm64
            archive: tar.gz
          - os: windows-latest
            artifact: celebi-windows-x64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build binary
        run: python build.py

      - name: Upload artifact (Unix)
        if: matrix.archive == 'tar.gz'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/celebi/
          compression-level: 9

      - name: Upload artifact (Windows)
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/celebi/
          compression-level: 9

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create archives
        run: |
          cd artifacts
          for dir in celebi-*/; do
            name="${dir%/}"
            if [ -d "$name" ]; then
              tar -czf "${name}.tar.gz" -C "$name" .
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/celebi-linux-x64.tar.gz
            artifacts/celebi-macos-arm64.tar.gz
            artifacts/celebi-windows-x64.zip
