name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check celebi/
      - run: uv run ruff format --check celebi/

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: celebi-linux
            platform: linux
          - os: macos-latest
            artifact: celebi-macos
            platform: macos
          - os: windows-latest
            artifact: celebi-windows
            platform: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Build bundle with PyInstaller
        run: uv run pyinstaller celebi.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/celebi/

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: celebi-linux
          path: dist/celebi/

      - name: Verify bundle imports
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'dist/celebi')
          # Check that key hidden imports are discoverable
          from celebi.config import GlobalConfig, ProjectConfig
          from celebi.agents import AGENTS
          print('Config imports OK')
          print(f'Agents: {list(AGENTS.keys())}')
          "
