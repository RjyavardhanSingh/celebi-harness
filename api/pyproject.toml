[project]
name = "celebi-harness"
version = "0.1.0"
description = "Time-travel harness for LLM API streams — proxy between coding agents and LLM providers to catch hallucinations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "kuzu>=0.11.3",
    "litellm[proxy]>=1.100.1",
    "pydantic>=2.13.5",
    "pyside6>=6.11.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
