target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    "E501",    # line too long — handled by formatter
    "N802",    # function name should be lowercase — Qt uses camelCase (hoverEnterEvent, closeEvent, etc.)
    "N807",    # function name should not start and end with __ — __init_db__ is intentional
    "SIM105",  # use contextlib.suppress — try-except-pass is clearer for simple cases
    "SIM108",  # use ternary operator — if-else is more readable sometimes
    "B904",    # raise ... from — not always needed for HTTPException
]

[lint.isort]
known-first-party = ["celebi", "app"]

[format]
quote-style = "double"
